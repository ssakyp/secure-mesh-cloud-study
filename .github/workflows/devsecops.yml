name: devsecops
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CONFTEST_VERSION: "0.71.1"
  OPA_VERSION: "1.21.1"
  KUBECONFORM_VERSION: "0.8.0"
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: cd svc && go vet ./... && go test ./... && CGO_ENABLED=0 go build -o ../meshsvc .
      - run: python3 tools/gen_keys.py && python3 tests/test_jwt_crosscheck.py
      - run: python3 scripts/attack_matrix.py --model --out /tmp/e2_model
      - run: python3 tests/synth_e1.py

  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: install policy tooling (pinned)
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          curl -sL -o opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" && chmod +x opa
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: python3 tools/gen_keys.py && python3 tools/gen_manifests.py
      - name: schema validation (Kubernetes + Istio CRDs)
        run: kubeconform -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' k8s/generated/*.yaml
      - run: opa test policy
      - name: hardened scenarios must pass every gate
        run: |
          for s in c d; do
            conftest test --combine -p policy k8s/generated/$s.yaml
            python3 tools/policy_intent_check.py k8s/generated/$s.yaml
          done
      - name: negative control - the unenforced mesh (A1) must be rejected
        run: "! conftest test --combine -p policy k8s/generated/a1.yaml"
      - name: seeded-misconfiguration benchmark (E4)
        run: python3 seeded/mutate.py --conftest conftest
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: seeded-results, path: seeded/out/results.csv }

  build-scan-sign:
    needs: [unit, policy-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mesh-svc
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: svc
          platforms: linux/amd64,linux/arm64      # Article 1 images were arm64-only
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom.spdx.json
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
